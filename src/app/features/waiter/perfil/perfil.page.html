<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">
  @if (staffInfo) {
    <div class="avatar-section">
      <div class="avatar-circle">
        {{ staffInfo.name.charAt(0).toUpperCase() }}
      </div>
      <h2>{{ staffInfo.name }}</h2>
      <p>{{ staffInfo.role }}</p>
    </div>

    <ion-list class="info-list">
      <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Nombre</h3>
          <p>{{ staffInfo.name }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Email</h3>
          <p>{{ staffInfo.email }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon name="shield-checkmark-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Rol</h3>
          <p>{{ staffInfo.role }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  }

  <div class="logout-section">
    <ion-button expand="block" color="danger" fill="outline" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
