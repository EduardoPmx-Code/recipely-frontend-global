server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — re-resolves hostnames dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $restaurant_api_host recipely-dev-restaurant-api-1;
    set $mesero_api_host recipely-dev-mesero-api-1;
    set $qr_steps_host recipely-dev-qr-steps-1;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to restaurant-api backend
    location /api/ {
        proxy_pass http://$restaurant_api_host:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Isolate the waiter API behind a distinct prefix so its routes cannot
    # collide with restaurant-admin endpoints.
    location /waiter-api/api/ {
        rewrite ^/waiter-api(/.*)$ $1 break;
        proxy_pass http://$mesero_api_host:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://$qr_steps_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
