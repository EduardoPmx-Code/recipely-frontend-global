substitutions:
  _REGION: 'southamerica-east1'
  _REPOSITORY: 'manager-agent-resto-repository'
  _SERVICE_NAME: 'frontend-global-restaurante'
  _API_URL: 'https://api-backend-restaurant-172370581837.southamerica-east1.run.app/api/'
  _WAITER_API_URL: 'https://mesero-api-172370581837.southamerica-east1.run.app/api/'
  _WS_URL: 'https://api-cliente-qr-172370581837.southamerica-east1.run.app'

steps:
  # Build de la imagen
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  # Push de la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}'
    waitFor: ['build']

  # Deploy a Cloud Run (imagen estática servida con nginx en el puerto 80)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--update-env-vars=API_URL=${_API_URL},WAITER_API_URL=${_WAITER_API_URL},WS_URL=${_WS_URL}'
    waitFor: ['push']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
